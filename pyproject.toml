[project]
name = "zotero-cli"
version = "0.1.0"
description = "Single-user, agent-first CLI for Zotero (literature management, PDF upload, RSS query)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer[all]>=0.12.0",
    "pyzotero>=1.5.0",
    "webdav4>=0.10.0",
    "pydantic-settings>=2.2.0",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
webdav-test = [
    "pytest-httpserver>=1.0",
    "wsgidav>=4.3",
]

[project.scripts]
zotero-cli = "zotero_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_cli"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pyzotero.*", "webdav4.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/zotero_cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

