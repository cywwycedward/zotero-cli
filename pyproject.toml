[project]
name = "zotero"
version = "0.1.1"
description = "Single-user, agent-first CLI for Zotero (literature management, PDF upload, RSS query)"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "cywwycatari" }]
license = { file = "LICENSE" }
keywords = ["zotero", "cli", "bibliography", "research", "rss", "webdav"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.12.0",
    "pyzotero>=1.13.1",
    "webdav4>=0.10.0",
    "pydantic-settings>=2.2.0",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
webdav-test = [
    "pytest-httpserver>=1.0",
    "wsgidav>=4.3",
]

[project.scripts]
zotero-cli = "zotero_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/cywwycedward/zotero-cli"
Repository = "https://github.com/cywwycedward/zotero-cli"
Issues = "https://github.com/cywwycedward/zotero-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_cli"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pyzotero.*", "webdav4.*", "defusedxml.*", "click.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/zotero_cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
